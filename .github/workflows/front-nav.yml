name: front-nav

# CI for the gz168/front-nav module + @erp/front-nav SDK + apps/web consumer +
# Customer integration. Five test suites run in one job so a single failure
# tells the whole story:
#   1. Module PHPUnit        (gz168/FrontNav/tests/Unit)
#   2. Host feature PHPUnit  (tests/Feature/FrontNav/* + full host suite)
#   3. SDK node:test         (packages/front-nav/tests/*.test.mjs)
#   4. apps/web typecheck    (apps/web/tsc --noEmit, scoped to front-nav files)
#   5. apps/web eslint       (apps/web/eslint, scoped to front-nav files)
# Pint runs before tests so formatting drift fails fast.

on:
  push:
    paths:
      - 'gz168/FrontNav/**'
      - 'packages/front-nav/**'
      - 'tests/Feature/FrontNav/**'
      - 'apps/web/src/lib/front-nav.ts'
      - 'apps/web/src/app/(desktop)/nav-demo/**'
      - 'apps/web/package.json'
      - '.github/workflows/front-nav.yml'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - 'gz168/FrontNav/**'
      - 'packages/front-nav/**'
      - 'tests/Feature/FrontNav/**'
      - 'apps/web/src/lib/front-nav.ts'
      - 'apps/web/src/app/(desktop)/nav-demo/**'
      - 'apps/web/package.json'
      - '.github/workflows/front-nav.yml'
      - 'composer.json'
      - 'composer.lock'

# Cancel previous runs on the same branch / PR to save CI minutes.
concurrency:
  group: front-nav-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: phpunit + node:test + apps/web typecheck + pint
    runs-on: ubuntu-latest

    env:
      CACHE_STORE: array
      APP_ENV: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, sqlite, pdo_sqlite
          coverage: none
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            packages/front-nav/package-lock.json
            apps/web/package-lock.json

      - name: Composer install
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --ignore-platform-req=ext-zip

      - name: Pint (dirty files only)
        # Default text output prints to stdout, which GitHub Actions
        # renders inline in the step log. `pint --dirty` is a no-op
        # when there is nothing to fix; failure means drift needs review.
        run: vendor/bin/pint --dirty

      - name: Module PHPUnit (gz168/FrontNav)
        working-directory: gz168/FrontNav
        run: ../../vendor/bin/phpunit --no-coverage

      - name: Host feature PHPUnit (FrontNav)
        run: php artisan test --filter=FrontNav --compact

      - name: SDK npm test (core + e2e + react)
        working-directory: packages/front-nav
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck

      - name: apps/web install (front-nav consumer)
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: apps/web typecheck (front-nav consumer)
        # Scoped to the files we added so pre-existing tsconfig drift in
        # the rest of apps/web does not fail our CI. The FrontNav demo
        # page is typechecked with strict mode (front-nav lib is also strict).
        working-directory: apps/web
        run: |
          npx tsc --noEmit \
            src/lib/front-nav.ts \
            src/app/\(desktop\)/nav-demo/page.tsx

      - name: apps/web eslint (front-nav consumer)
        working-directory: apps/web
        run: |
          npx eslint \
            src/lib/front-nav.ts \
            'src/app/(desktop)/nav-demo/page.tsx'
