name: clients

on:
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'modules/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/clients.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'modules/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/clients.yml'

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check:clients (node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspaces
        run: npm ci --no-audit --no-fund

      - name: check:clients
        run: npm run check:clients
